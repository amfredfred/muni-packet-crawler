[project]
name = "muni-packet-crawler"
version = "0.1.0"
description = "Nationwide crawler for municipal Planning/Zoning/Historic/Licensing board meeting packets — discovers municipal websites, crawls their agenda pages, and extracts upcoming meeting packets, with a local control-panel UI."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "flask>=3.0",
    "pypdf>=5.0",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "Pillow>=10.0",
]

[project.scripts]
muni-build-index = "build_index:main"
muni-crawl = "crawl_sites:main"
muni-review-packets = "review_packets:main"
muni-list-upcoming = "list_upcoming:main"
muni-webapp = "webapp:main"
muni-export-seed = "export_seed_db:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "db",
    "date_extract",
    "crawl_sites",
    "build_index",
    "list_upcoming",
    "webapp",
    "pdf_review",
    "review_packets",
    "auth",
    "invoices",
    "export_seed_db",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scrapers*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
