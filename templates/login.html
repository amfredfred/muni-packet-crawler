<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Muni Packet Crawler</title>
<style>
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1216; color: #e6e9ee; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #171b21; border: 1px solid #2a2f37; border-radius: 8px; padding: 32px; max-width: 360px; text-align: center; }
  h1 { font-size: 18px; margin-top: 0; }
  p { color: #8a919c; font-size: 13px; }
  input { background: #0f1216; border: 1px solid #2a2f37; color: #e6e9ee; border-radius: 6px; padding: 10px 14px; font-size: 20px; letter-spacing: 4px; text-align: center; width: 160px; }
  button { background: #4f8cff; color: white; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer; margin-top: 12px; display: block; margin-left: auto; margin-right: auto; }
  .flash { background: rgba(248,81,73,0.15); border: 1px solid #f85149; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Enter authenticator code</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  <form method="post">
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
