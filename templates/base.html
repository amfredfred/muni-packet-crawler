<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Muni Packet Crawler{% endblock %}</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --border: #2a2f37; --text: #e6e9ee;
    --muted: #8a919c; --accent: #4f8cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    padding: 20px 14px; display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar h1 { font-size: 15px; margin: 0; font-weight: 600; padding: 0 8px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav a {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 8px 10px; border-radius: 6px;
  }
  .sidebar nav a:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .sidebar nav a.active { background: rgba(79,140,255,0.15); color: var(--text); }
  .sidebar .logout-form { margin-top: auto; }
  .sidebar .logout-form button { width: 100%; }
  main { padding: 24px; flex: 1; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; align-items: start; }
  .grid .card { margin-bottom: 0; }
  .grid .span-all { grid-column: 1 / -1; }
  .grid .col { display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .filter-layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
  .filter-layout .card { margin-bottom: 0; }
  .filter-layout .filter-sidebar { position: sticky; top: 24px; }
  @media (max-width: 900px) { .filter-layout { grid-template-columns: 1fr; } .filter-layout .filter-sidebar { position: static; } }
  .filters-vertical { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .filters-vertical label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .filters-vertical select, .filters-vertical input { width: 100%; }
  .filters-vertical .check-field { flex-direction: row; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent; border: none; color: var(--muted); padding: 9px 16px;
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel[hidden] { display: none; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 16px; min-width: 110px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover { background: rgba(255,255,255,0.02); }
  tr.reviewed { opacity: 0.55; }
  a { color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--ok); }
  .badge.warn { background: rgba(210,153,34,0.15); color: var(--warn); }
  .badge.err { background: rgba(248,81,73,0.15); color: var(--err); }
  .badge.muted { background: rgba(138,145,156,0.15); color: var(--muted); }
  button, .btn { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, .btn.secondary { background: var(--border); color: var(--text); }
  button.danger { background: var(--err); }
  input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  form.inline { display: inline; }
  .filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .flash { background: rgba(79,140,255,0.15); border: 1px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .pagination { margin-top: 14px; display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <h1>🏛 Muni Packet Crawler</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('municipalities') }}" class="{{ 'active' if request.endpoint == 'municipalities' }}">Municipalities</a>
      <a href="{{ url_for('packets') }}" class="{{ 'active' if request.endpoint == 'packets' }}">Packets</a>
      <a href="{{ url_for('extract_url') }}" class="{{ 'active' if request.endpoint == 'extract_url' }}">Extract URL</a>
      <a href="{{ url_for('new_municipality') }}" class="{{ 'active' if request.endpoint == 'new_municipality' }}">Add Municipality</a>
      <a href="{{ url_for('invoices') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('invoice') }}">Invoices</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}" class="logout-form">
      <button type="submit" class="secondary">Log out</button>
    </form>
  </aside>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
